services:
  - type: web
    name: edupulse-flask
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 180 --bind 0.0.0.0:$PORT wsgi:application
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.10.16
      - key: EDUPULSE_SECRET_KEY
        generateValue: true
      - key: EDUPULSE_ADMIN_PASSWORD
        generateValue: true
