services:
  - type: web
    name: edupulse-flask
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py wsgi:application
    healthCheckPath: /api/health/live
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.10.16
      - key: EDUPULSE_SECRET_KEY
        generateValue: true
      - key: EDUPULSE_ADMIN_PASSWORD
        generateValue: true
