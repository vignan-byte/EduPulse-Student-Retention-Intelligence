name: EduPulse Flask verification
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app src config.py app.py wsgi.py tests
      - name: Verify artifact loading and Flask routes
        env:
          FLASK_ENV: testing
        run: python -m pytest -q tests/test_flask_app.py tests/test_api_endpoints.py
      - name: Verify dependency resolution
        run: python -m pip check
