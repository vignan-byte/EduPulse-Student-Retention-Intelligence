name: Student Retention CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q src app.py
      - name: Run tests
        run: python -m pytest -q
      - name: Train public-data demo model
        run: python -m src.train --stage "After semester 1"
      - name: Run Flask integration smoke
        run: python -m pytest -q tests/test_flask_app.py tests/test_api_endpoints.py tests/test_model_compatibility.py
